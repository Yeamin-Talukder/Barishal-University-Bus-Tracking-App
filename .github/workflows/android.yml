# Checks, builds and releases the Android app.
#
# Every push and pull request: flutter analyze and every test.
# A push to main whose pubspec.yaml version has no release yet (no tag
# v<version>) also builds the signed APKs and publishes the GitHub release
# that the app's own updater and the website download from. Raise the
# version (for example 1.0.0+1 → 1.1.0+2) to release; any other push to
# main is only checked.
#
# One-time setup, Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64  the signing key (.jks / .keystore), base64
#   GOOGLE_SERVICES_JSON     android/app/google-services.json, base64
# Optional, for a key other than Android's debug key:
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See RELEASING.md.
name: Android app

on:
  push:
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter github

  release:
    name: Build and release
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One release at a time; a second push waits instead of racing it.
    concurrency:
      group: android-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, for the version check and the notes.
          fetch-depth: 0

      - name: Is this a new version?
        id: version
        run: bash tools/release/check_version.sh

      - name: Check the signing secrets
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$GOOGLE_SERVICES" ] || missing="$missing GOOGLE_SERVICES_JSON"
          if [ -n "$missing" ]; then
            # Never publish with another key: phones would refuse the update
            # and Google sign-in would stop working.
            echo "::error::Add these repository secrets before releasing:$missing (see RELEASING.md)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.release == 'true'
        with:
          # maplibre_gl needs Java 21 or newer.
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.release == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Put the secrets in place
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "$GOOGLE_SERVICES" | base64 --decode > android/app/google-services.json
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the APKs
        if: steps.version.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Empty optional secrets fall back to the debug key's values.
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || unset ANDROID_KEYSTORE_PASSWORD
          [ -n "$ANDROID_KEY_ALIAS" ] || unset ANDROID_KEY_ALIAS
          [ -n "$ANDROID_KEY_PASSWORD" ] || unset ANDROID_KEY_PASSWORD
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          v=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/bu-bus-tracker-v$v-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/bu-bus-tracker-v$v-armv7.apk"
          ls -l dist

      - name: Check the signature
        if: steps.version.outputs.release == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/*-arm64.apk | grep -i "SHA-256 digest" | head -1

      - name: Write the release notes
        if: steps.version.outputs.release == 'true'
        run: |
          bash tools/release/release_notes.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.prev_tag }}" \
            dist > dist/notes.md
          cat dist/notes.md

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          gh release create "v$v" \
            --target "$GITHUB_SHA" \
            --title "BU Bus Tracker $v" \
            --notes-file dist/notes.md \
            dist/*.apk

      - name: Refresh the website's download section
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main || echo "::warning::Could not start the website workflow; it refreshes by itself within six hours."

      - name: Remove the secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" android/app/google-services.json
