<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BU Shuttle Map 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-screen tilted map; title card top-left, bus card bottom-left floating over it. */
:root {
  --bg: #e9eef0;
  --card: rgb(255 255 255 / .9);
  --card-line: rgb(20 40 50 / .12);
  --ink: #12211c;
  --ink-2: #48605a;
  --ink-3: #7c8f89;
  --accent: #1c6f8f;
  --route: #1c86ad;
  --bus-red: #c0161f;
  --ok: #138a5e;
  --building: #e8e2d6;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-bn: "Hind Siliguri", "Noto Sans Bengali", "Vrinda", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1518; --card: rgb(18 27 31 / .88); --card-line: rgb(255 255 255 / .1);
    --ink: #e7f0ec; --ink-2: #a8bab3; --ink-3: #74867f; --accent: #63b8d8; --route: #4fc3ea;
    --bus-red: #ff5a5f; --ok: #35c98f; --building: #33424c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1518; --card: rgb(18 27 31 / .88); --card-line: rgb(255 255 255 / .1);
  --ink: #e7f0ec; --ink-2: #a8bab3; --ink-3: #74867f; --accent: #63b8d8; --route: #4fc3ea;
  --bus-red: #ff5a5f; --ok: #35c98f; --building: #33424c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#map { position: fixed; inset: 0; }

.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.card { pointer-events: auto; background: var(--card); border: 1px solid var(--card-line); border-radius: 14px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 28px rgb(0 0 0 / .14); }
.title { align-self: flex-start; padding: 12px 16px; max-width: min(360px, calc(100% - 60px)); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { margin: 2px 0; font: 700 22px/1.15 var(--font-display); letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.title p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

.hud { align-self: flex-start; width: min(410px, 100%); padding: 14px 16px; display: grid; gap: 10px; }
.hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.bus-id { font: 700 18px/1.1 var(--font-display); display: flex; align-items: center; gap: 8px; }
.bus-id i { width: 12px; height: 12px; border-radius: 3px; background: var(--bus-red); display: inline-block; }
.hud-dest { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.hud-dest .bn { font-family: var(--font-bn); color: var(--ink-3); }
.speed { text-align: right; font-variant-numeric: tabular-nums; }
.speed b { font: 700 28px/1 var(--font-display); }
.speed small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; }
.hud-next { font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 11%, transparent); display: flex; justify-content: space-between; gap: 10px; }
.hud-next .eta { font-weight: 700; color: var(--ok); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--card-line); border-radius: 9px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 6px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.hint { margin: 0; font-size: 11.5px; color: var(--ink-3); }

.bus-tag { background: var(--bus-red); color: #fff; font: 700 11.5px/1 var(--font-body); padding: 4px 7px; border-radius: 6px; box-shadow: 0 2px 6px rgb(0 0 0 / .25); white-space: nowrap; cursor: pointer; }
.maplibregl-ctrl-group { background: var(--card); }

@media (max-width: 640px) {
  h1 { font-size: 18px; }
  .title p { display: none; }
  .hud { width: 100%; padding: 12px; }
  .speed b { font-size: 24px; }
}
</style>
</head>
<body>
<div id="map" aria-label="3D map of the campus shuttle route"></div>
<div class="ui">
  <header class="card title">
    <div class="eyebrow">University of Barishal · Route R1</div>
    <h1>Campus <span>↔</span> Rupatoli</h1>
    <p>Live map with 3D buildings. Buses are simulated.</p>
  </header>
  <section class="card hud" aria-label="Bus details">
    <div class="hud-top">
      <div>
        <div class="bus-id"><i aria-hidden="true"></i><span id="hudBus">BU-01</span></div>
        <div class="hud-dest" id="hudDest">To Rupatoli</div>
      </div>
      <div class="speed"><b id="hudSpeed">0</b><small>KM/H</small></div>
    </div>
    <div class="hud-next" id="hudNext">Starting…</div>
    <div class="row">
      <div class="seg" id="camSeg" role="group" aria-label="Camera">
        <button type="button" data-cam="BU-01" aria-pressed="true">Follow BU-01</button>
        <button type="button" data-cam="BU-02" aria-pressed="false">BU-02</button>
        <button type="button" data-cam="route" aria-pressed="false">Whole route</button>
      </div>
      <div class="seg" id="speedSeg" role="group" aria-label="Simulation speed">
        <button type="button" data-mult="1" aria-pressed="true">1×</button>
        <button type="button" data-mult="3" aria-pressed="false">3×</button>
        <button type="button" data-mult="8" aria-pressed="false">8×</button>
      </div>
    </div>
    <p class="hint">Drag to pan · right-drag or two fingers to tilt and turn · scroll to zoom</p>
  </section>
</div>

<script src="3d-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const D = window.CORRIDOR;
try { await document.fonts.load('700 40px "Hind Siliguri"'); await document.fonts.load('800 40px "Inter"'); } catch (e) {}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
const mod = (a, n) => ((a % n) + n) % n;
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- route data (metres, x = east, y = north) → lng/lat → map (Mercator) units ---------- */
const [LNG0, LAT0] = D.origin;
const KX = Math.cos(LAT0 * Math.PI / 180) * 111320, KY = 110574;
const toLngLat = (x, y) => [x / KX + LNG0, y / KY + LAT0];
const N = D.path.length / 3, STEP = D.loopLen / N, LOOP = D.loopLen;
const PX = new Float64Array(N), PY = new Float64Array(N), MX = new Float64Array(N), MY = new Float64Array(N);
for (let i = 0; i < N; i++) {
  PX[i] = D.path[i * 3]; PY[i] = D.path[i * 3 + 1];
  const m = maplibregl.MercatorCoordinate.fromLngLat(toLngLat(PX[i], PY[i]), 0);
  MX[i] = m.x; MY[i] = m.y;
}
const METRE = maplibregl.MercatorCoordinate.fromLngLat([LNG0, LAT0], 0).meterInMercatorCoordinateUnits();
const TAG = D.pathTag;
function sample(arr, s) { const u = mod(s, LOOP) / STEP, i = Math.floor(u) % N, t = u - Math.floor(u); return lerp(arr[i], arr[(i + 1) % N], t); }

// curvature (+ = left turn) and a speed limit that slows the bus before bends
const HEAD = new Float32Array(N), KAPPA = new Float32Array(N), VMAX = new Float32Array(N);
for (let i = 0; i < N; i++) { const a = mod(i - 1, N), b = (i + 1) % N; HEAD[i] = Math.atan2(PY[b] - PY[a], PX[b] - PX[a]); }
for (let i = 0; i < N; i++) KAPPA[i] = wrapAngle(HEAD[(i + 3) % N] - HEAD[mod(i - 3, N)]) / (6 * STEP);
const campusStop = D.stops.find(s => s.id === "campus");
const A_LAT = 1.5, DEC_PLAN = 1.0;
for (let i = 0; i < N; i++) {
  let k = 0; for (let j = -4; j <= 4; j++) k += Math.abs(KAPPA[mod(i + j, N)]); k /= 9;
  const nearCampus = Math.hypot(PX[i] - campusStop.x, PY[i] - campusStop.y) < 330;
  const cruise = nearCampus ? 7.5 : TAG[i] === "a" || TAG[i] === "b" ? 12 : 6.5;
  VMAX[i] = Math.min(cruise, Math.sqrt(A_LAT / Math.max(k, 1e-4)));
}
for (let pass = 0; pass < 2; pass++)
  for (let k = N - 1; k >= 0; k--) { const n = (k + 1) % N; VMAX[k] = Math.min(VMAX[k], Math.sqrt(VMAX[n] ** 2 + 2 * DEC_PLAN * STEP)); }

const STOP_ON_LOOP = [];
for (const st of D.stops) for (const s of st.stops) STOP_ON_LOOP.push({ s: s.s, id: st.id, name: st.name, bn: st.bn, terminal: st.terminal });
STOP_ON_LOOP.sort((a, b) => a.s - b.s);

/* ---------- the red double-decker (built in metres: +X forward, +Y up, -Z = left/kerb side) ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function destinationTexture(bn, en) {
  return canvasTex(512, 80, (g, w, h) => {
    g.fillStyle = "#111"; g.fillRect(0, 0, w, h);
    g.shadowColor = "#ff9b2f"; g.shadowBlur = 10; g.fillStyle = "#ffb347"; g.textBaseline = "middle";
    g.font = '700 44px "Hind Siliguri", sans-serif'; g.fillText(bn, 18, h / 2 + 4);
    g.font = '800 34px "Inter", sans-serif'; g.textAlign = "right"; g.fillText(en, w - 18, h / 2 + 2);
  });
}
const DEST = { rupa: destinationTexture("রূপাতলী", "RUPATOLI"), campus: destinationTexture("ক্যাম্পাস", "CAMPUS") };
const sideTex = canvasTex(1024, 96, (g, w, h) => {
  g.fillStyle = "#f6ead0"; g.textBaseline = "middle";
  g.font = '700 50px "Hind Siliguri", sans-serif'; g.fillText("বরিশাল বিশ্ববিদ্যালয়", 8, h / 2 + 6);
  g.font = '800 30px "Inter", sans-serif'; g.textAlign = "right"; g.fillText("UNIVERSITY OF BARISHAL", w - 8, h / 2 + 2);
});
const shadowTex = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
  r.addColorStop(0, "rgba(0,0,0,0.55)"); r.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});

// Lambert (no specular): the map's camera is not a normal three.js camera, so view-dependent shine would look wrong.
const mat = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });

function makeBus(id) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x8a8070, 1.6));
  const sunL = new THREE.DirectionalLight(0xfff2dc, 1.9); sunL.position.set(60, 120, 40); scene.add(sunL);

  const root = new THREE.Group(); root.rotation.order = "YZX"; scene.add(root);
  const body = new THREE.Group(); root.add(body);
  const red = mat(0xbf1520), redDark = mat(0x8c0f16), cream = mat(0xf3e6c4);
  const glass = mat(0x1b2730), black = mat(0x1a1b1d);
  const add = (geo, m, x, y, z, parent = body) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); parent.add(o); return o; };

  const blob = add(new THREE.PlaneGeometry(13, 4.6), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }), 0, 0.03, 0, root);
  blob.rotation.x = -Math.PI / 2; blob.renderOrder = -1;

  add(new THREE.BoxGeometry(10.1, 0.6, 2.3), redDark, 0, 0.66, 0);                       // skirt between the wheels
  add(new RoundedBoxGeometry(10.6, 1.55, 2.5, 3, 0.22), red, 0, 1.68, 0);                 // lower deck
  add(new THREE.BoxGeometry(10.64, 0.34, 2.54), cream, 0, 2.55, 0);                        // band between decks
  add(new RoundedBoxGeometry(10.5, 1.75, 2.5, 3, 0.32), red, -0.05, 3.55, 0);              // upper deck
  add(new RoundedBoxGeometry(10.1, 0.12, 2.3, 2, 0.05), cream, -0.05, 4.43, 0);            // roof panel
  for (const z of [-1.255, 1.255]) {
    add(new THREE.BoxGeometry(8.2, 0.78, 0.02), glass, -0.95, 1.98, z);
    add(new THREE.BoxGeometry(9.9, 0.95, 0.02), glass, -0.05, 3.55, z);
    for (let x = -4.8; x <= 4.8; x += 1.25) add(new THREE.BoxGeometry(0.12, 0.98, 0.03), red, x, 3.55, z);
    for (let x = -4.8; x <= 3.2; x += 1.6) add(new THREE.BoxGeometry(0.12, 0.8, 0.03), red, x, 1.98, z);
    const side = add(new THREE.PlaneGeometry(7.2, 0.68), mat(0xffffff, { map: sideTex, transparent: true, polygonOffset: true, polygonOffsetFactor: -2 }), -1.0, 1.2, z * 1.006);
    if (z < 0) side.rotation.y = Math.PI;
  }
  add(new THREE.BoxGeometry(0.04, 1.05, 2.25), glass, 5.3, 1.95, 0);       // windscreen
  add(new THREE.BoxGeometry(0.04, 0.95, 2.2), glass, 5.21, 3.55, 0);       // upper front window
  add(new THREE.BoxGeometry(0.04, 0.95, 2.2), glass, -5.31, 3.55, 0);      // upper rear window
  add(new THREE.BoxGeometry(0.04, 0.7, 2.0), glass, -5.31, 1.95, 0);       // lower rear window
  add(new THREE.BoxGeometry(0.08, 0.44, 2.3), black, 5.33, 2.55, 0);       // board housing
  const destMat = new THREE.MeshBasicMaterial({ map: DEST.rupa });
  add(new THREE.PlaneGeometry(2.2, 0.36), destMat, 5.38, 2.55, 0).rotation.y = Math.PI / 2;
  add(new THREE.BoxGeometry(0.3, 0.32, 2.56), black, 5.2, 0.55, 0);
  add(new THREE.BoxGeometry(0.3, 0.32, 2.56), black, -5.2, 0.55, 0);
  const headMat = new THREE.MeshBasicMaterial({ color: 0xfff6d8 }), tailMat = new THREE.MeshBasicMaterial({ color: 0xff2a2a });
  for (const z of [-0.9, 0.9]) {
    add(new THREE.BoxGeometry(0.06, 0.2, 0.36), headMat, 5.31, 1.05, z);
    add(new THREE.BoxGeometry(0.06, 0.3, 0.22), tailMat, -5.31, 1.1, z);
    const arm = add(new THREE.BoxGeometry(0.5, 0.05, 0.05), black, 5.3, 2.2, z * 1.25);
    arm.rotation.y = z > 0 ? -0.5 : 0.5;
    add(new THREE.BoxGeometry(0.06, 0.4, 0.22), black, 5.5, 2.0, z * 1.42);
  }
  const plateTex = canvasTex(256, 64, (g, w, h) => { g.fillStyle = "#f4f4f0"; g.fillRect(0, 0, w, h); g.fillStyle = "#111"; g.font = '800 40px "Inter", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(id, w / 2, h / 2 + 2); });
  add(new THREE.PlaneGeometry(0.62, 0.16), new THREE.MeshBasicMaterial({ map: plateTex }), 5.36, 0.58, 0).rotation.y = Math.PI / 2;
  const door = add(new THREE.BoxGeometry(0.95, 1.85, 0.06), mat(0x24313a), 4.15, 1.5, -1.27);

  const tireGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.34, 20).rotateX(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.27, 0.27, 0.36, 12).rotateX(Math.PI / 2);
  const spokeGeo = new THREE.BoxGeometry(0.5, 0.07, 0.38);
  const rubber = mat(0x161616), steel = mat(0xb9bec4);
  const wheels = [], steer = [];
  for (const [x, front] of [[3.15, true], [-2.85, false]]) for (const z of [-1.08, 1.08]) {
    const pivot = new THREE.Group(); pivot.position.set(x, 0.5, z); root.add(pivot);
    const spin = new THREE.Group(); pivot.add(spin);
    spin.add(new THREE.Mesh(tireGeo, rubber), new THREE.Mesh(hubGeo, steel));
    const s1 = new THREE.Mesh(spokeGeo, rubber), s2 = new THREE.Mesh(spokeGeo, rubber); s2.rotation.z = Math.PI / 2;
    spin.add(s1, s2);
    wheels.push(spin); if (front) steer.push(pivot);
  }

  const el = document.createElement("div");
  el.className = "bus-tag"; el.textContent = id;
  const marker = new maplibregl.Marker({ element: el, anchor: "bottom", offset: [0, -34], pitchAlignment: "viewport", rotationAlignment: "viewport" });
  el.addEventListener("click", () => setCamera(id));
  return { scene, root, body, wheels, steer, door, destMat, marker, el };
}

/* ---------- simulation ---------- */
const ACC_MAX = 1.1, DEC_MAX = 2.0, JERK = 1.4, WB = 6.0;
const buses = [{ id: "BU-01", s: 40, temper: 1.0 }, { id: "BU-02", s: LOOP * 0.52, temper: 0.94 }]
  .map(b => ({ ...b, ...makeBus(b.id), v: 0, a: 0, dwell: 0, dwellFor: 0, arrived: null, lastStop: null,
    roll: 0, rollV: 0, pitch: 0, pitchV: 0, doorOpen: 0, dest: "rupa", t: Math.random() * 10, mx: 0, my: 0, lngLat: [0, 0], yaw: 0, k: 1 }));
const loopDist = (from, to) => mod(to - from, LOOP);
function nextStop(b) {
  let best = null, bd = Infinity;
  for (const st of STOP_ON_LOOP) { if (st === b.lastStop) continue; const d = loopDist(b.s, st.s); if (d < bd) { bd = d; best = st; } }
  return { stop: best, dist: bd };
}
function stepBus(b, h, other) {
  if (b.dwell > 0) { b.dwell -= h; b.v = 0; b.a = 0; if (b.dwell <= 0) b.arrived = null; return; }
  const { stop, dist } = nextStop(b);
  let target = sample(VMAX, b.s) * b.temper;
  target = Math.min(target, Math.sqrt(Math.max(0, 2 * DEC_PLAN * (dist - 0.3))));
  const gap = loopDist(b.s, other.s);
  if (gap < 90) target = Math.min(target, Math.sqrt(Math.max(0, 2 * DEC_PLAN * (gap - 24))));
  const wantA = clamp((target - b.v) * 1.3, -DEC_MAX, ACC_MAX);
  b.a += clamp(wantA - b.a, -JERK * h, JERK * h);
  b.v = Math.max(0, b.v + b.a * h);
  if (b.v === 0 && b.a < 0) b.a = 0;
  if (dist < 3 && b.v < 2) b.v = Math.max(0.3, Math.min(b.v, Math.sqrt(2 * 0.7 * dist)));
  let ds = b.v * h;
  if (ds >= dist) {
    ds = dist; b.v = 0; b.a = 0;
    b.dwellFor = b.dwell = stop.terminal ? 26 : 11 + Math.random() * 7;
    b.arrived = b.lastStop = stop;
  }
  b.s = mod(b.s + ds, LOOP);
  for (const w of b.wheels) w.rotation.z -= ds / 0.5;
}
function placeBus(b, dt, time) {
  // bicycle model: rear and front axles both sit on the lane line, so the bus turns like a real one
  const rs = b.s - WB / 2, fs = b.s + WB / 2;
  const rx = sample(PX, rs), ry = sample(PY, rs), fx = sample(PX, fs), fy = sample(PY, fs);
  b.yaw = Math.atan2(fy - ry, fx - rx);
  b.root.rotation.y = b.yaw;
  b.mx = (sample(MX, rs) + sample(MX, fs)) / 2; b.my = (sample(MY, rs) + sample(MY, fs)) / 2;
  b.lngLat = toLngLat((rx + fx) / 2, (ry + fy) / 2);
  const steerA = clamp(Math.atan(WB * sample(KAPPA, fs)), -0.6, 0.6);
  for (const p of b.steer) p.rotation.y = lerp(p.rotation.y, steerA, damp(10, dt));
  const latA = b.v * b.v * sample(KAPPA, b.s);
  const rollT = clamp(latA * 0.022, -0.07, 0.07), pitchT = clamp(b.a * 0.014, -0.035, 0.035);
  b.rollV += ((rollT - b.roll) * 45 - b.rollV * 9) * dt; b.roll += b.rollV * dt;
  b.pitchV += ((pitchT - b.pitch) * 40 - b.pitchV * 8) * dt; b.pitch += b.pitchV * dt;
  b.body.rotation.set(b.roll, 0, b.pitch);
  b.body.position.y = b.v < 0.2 ? Math.sin(time * 38 + b.t) * 0.006 : Math.sin(time * 9 + b.t) * 0.004 * Math.min(1, b.v / 8);
  const wantOpen = b.dwell > 1.6 && b.dwellFor - b.dwell > 0.8 ? 1 : 0;
  b.doorOpen = lerp(b.doorOpen, wantOpen, damp(4, dt));
  b.door.position.set(4.15 - b.doorOpen * 0.98, 1.5, -1.27 - b.doorOpen * 0.08);
  const tg = TAG[Math.floor(mod(b.s, LOOP) / STEP) % N];
  const dest = tg === "a" || tg === "c" ? "rupa" : "campus";
  if (dest !== b.dest) { b.dest = dest; b.destMat.map = DEST[dest]; b.destMat.needsUpdate = true; }
  b.marker.setLngLat(b.lngLat);
  if (b.tagDy != null) b.marker.setOffset([0, Math.min(-10, b.tagDy - 8)]);
}

/* ---------- map ---------- */
const STYLES = { light: "https://tiles.openfreemap.org/styles/liberty", dark: "https://tiles.openfreemap.org/styles/dark" };
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const ROUTE_LL = D.route.map(([x, y]) => toLngLat(x, y));
const ROUTE_BACK_LL = D.routeBack.map(([x, y]) => toLngLat(x, y));
const BUILDINGS = { type: "FeatureCollection", features: D.mapBld.map(([h, ...flat]) => {
  const ring = [];
  for (let i = 0; i < flat.length; i += 2) ring.push(toLngLat(flat[i], flat[i + 1]));
  ring.push(ring[0]);
  return { type: "Feature", properties: { h }, geometry: { type: "Polygon", coordinates: [ring] } };
}) };
const routeBounds = ROUTE_LL.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(ROUTE_LL[0], ROUTE_LL[0]));

const map = new maplibregl.Map({
  container: "map",
  style: darkMQ.matches ? STYLES.dark : STYLES.light,
  center: routeBounds.getCenter(), zoom: 14.6, pitch: 55, bearing: -20,
  maxPitch: 75, antialias: true, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");

// The buses are drawn by three.js inside the map's own WebGL canvas, sharing its depth buffer,
// so buildings correctly hide a bus that drives behind them.
const ROT_X = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);
const busLayer = {
  id: "buses-3d", type: "custom", renderingMode: "3d",
  onAdd(m, gl) {
    this.camera = new THREE.Camera();
    this.renderer = new THREE.WebGLRenderer({ canvas: m.getCanvas(), context: gl, antialias: true });
    this.renderer.autoClear = false;
  },
  render(gl, matrix) {
    const proj = new THREE.Matrix4().fromArray(matrix);
    for (const b of buses) {
      // Each bus gets its own origin at its position, which keeps the numbers small and the model steady.
      const k = METRE * b.k;
      const model = new THREE.Matrix4().makeTranslation(b.mx, b.my, 0).scale(new THREE.Vector3(k, -k, k)).multiply(ROT_X);
      this.camera.projectionMatrix = proj.clone().multiply(model);
      this.renderer.resetState();
      this.renderer.render(b.scene, this.camera);
      // Where does the roof land on screen? Lift the bus's name tag to just above it.
      const g = new THREE.Vector4(b.mx, b.my, 0, 1).applyMatrix4(proj);
      const top = new THREE.Vector4(b.mx, b.my, 4.6 * k, 1).applyMatrix4(proj);
      const H = map.getCanvas().clientHeight;
      if (g.w > 0 && top.w > 0) b.tagDy = ((1 - top.y / top.w) - (1 - g.y / g.w)) / 2 * H;
    }
  },
};

function addLayers() {
  const dark = darkMQ.matches;
  const firstSymbol = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  if (map.getLayer("building-3d")) map.removeLayer("building-3d");

  // Both directions: they share one road except where the N8 splits into two carriageways near Rupatoli.
  map.addSource("route", { type: "geojson", data: { type: "Feature", properties: {}, geometry: { type: "MultiLineString", coordinates: [ROUTE_LL, ROUTE_BACK_LL] } } });
  map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": dark ? "#0f1518" : "#ffffff", "line-opacity": 0.85, "line-width": ["interpolate", ["exponential", 2], ["zoom"], 13, 6, 18, 40] } }, firstSymbol);
  map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": cssVar("--route"), "line-opacity": 0.55, "line-width": ["interpolate", ["exponential", 2], ["zoom"], 13, 3, 18, 26] } }, firstSymbol);

  // Raised buildings within 650 m of the route, from current OpenStreetMap data. Floors come from OSM where
  // tagged, otherwise from footprint size. The map's own flat footprints still show everything else.
  map.addSource("bu-buildings", { type: "geojson", data: BUILDINGS });
  map.addLayer({
    id: "buildings-3d", type: "fill-extrusion", source: "bu-buildings", minzoom: 14,
    paint: {
      "fill-extrusion-color": dark
        ? ["interpolate", ["linear"], ["get", "h"], 3, "#34434d", 16, "#465864"]
        : ["interpolate", ["linear"], ["get", "h"], 3, "#efe9df", 16, "#dcd6cc"],
      "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 14, 0, 15.2, ["get", "h"]],
      "fill-extrusion-base": 0,
      "fill-extrusion-opacity": 0.96,
    },
  }, firstSymbol);

  map.addSource("stops", { type: "geojson", data: { type: "FeatureCollection", features: D.stops.map(s => ({
    type: "Feature", properties: { name: s.name, terminal: s.terminal }, geometry: { type: "Point", coordinates: toLngLat(s.x, s.y) } })) } });
  map.addLayer({ id: "stop-dot", type: "circle", source: "stops",
    paint: { "circle-radius": ["case", ["get", "terminal"], 8, 6], "circle-color": "#ffffff", "circle-stroke-color": cssVar("--route"), "circle-stroke-width": 3, "circle-pitch-alignment": "map" } });
  map.addLayer({ id: "stop-label", type: "symbol", source: "stops",
    layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Bold"], "text-size": 13, "text-offset": [0, -1.6], "text-anchor": "bottom" },
    paint: { "text-color": dark ? "#e7f0ec" : "#12211c", "text-halo-color": dark ? "#0f1518" : "#ffffff", "text-halo-width": 1.8 } });

  map.setLight({ anchor: "viewport", color: "#ffffff", intensity: dark ? 0.25 : 0.4, position: [1.4, 200, 40] });
  try { map.setSky({ "sky-color": dark ? "#0d1b2a" : "#9fd0f0", "horizon-color": dark ? "#20384c" : "#e6f2f8", "fog-color": dark ? "#162733" : "#eef4f6", "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.7, "fog-ground-blend": 0.85 }); } catch (e) {}
  map.addLayer(busLayer);
}
map.on("style.load", addLayers);
darkMQ.addEventListener("change", e => map.setStyle(e.matches ? STYLES.dark : STYLES.light, { diff: false }));
map.on("load", () => { for (const b of buses) b.marker.addTo(map); setCamera("BU-01"); });

/* ---------- camera: follow a bus like a navigation app, or show the whole route ---------- */
let followId = "BU-01", following = false, autoBearing = true;
function setCamera(id) {
  document.querySelectorAll("#camSeg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.cam === id));
  if (id === "route") {
    following = false;
    map.fitBounds(routeBounds, { padding: { top: 90, bottom: 260, left: 40, right: 40 }, pitch: 50, bearing: -20, duration: 2200 });
    return;
  }
  followId = id; following = true; autoBearing = true;
  const b = buses.find(x => x.id === id);
  map.flyTo({ center: b.lngLat, zoom: 18.9, pitch: 64, bearing: 90 - b.yaw * 180 / Math.PI, duration: 2600, essential: true });
}
map.on("dragstart", e => { if (e.originalEvent) { following = false; document.querySelectorAll("#camSeg button").forEach(x => x.setAttribute("aria-pressed", false)); } });
map.on("rotatestart", e => { if (e.originalEvent) autoBearing = false; });
function updateCamera(dt) {
  if (!following || map.isMoving()) return;   // never fight the user's own zoom, tilt or a fly-in
  const b = buses.find(x => x.id === followId);
  const c = map.getCenter(), k = damp(4, dt);
  const center = [lerp(c.lng, b.lngLat[0], k), lerp(c.lat, b.lngLat[1], k)];
  let bearing = map.getBearing();
  if (autoBearing) {
    const want = 90 - b.yaw * 180 / Math.PI;
    bearing += (((want - bearing + 540) % 360) - 180) * damp(1.1, dt);
  }
  map.jumpTo({ center, bearing });
}

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
let mult = 1;
$("camSeg").addEventListener("click", e => { const btn = e.target.closest("button"); if (btn) setCamera(btn.dataset.cam); });
$("speedSeg").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  mult = +btn.dataset.mult;
  document.querySelectorAll("#speedSeg button").forEach(x => x.setAttribute("aria-pressed", x === btn));
});
const fmtEta = sec => sec < 30 ? "Arriving" : `${Math.max(1, Math.round(sec / 60))} min`;
function updateHud() {
  const b = buses.find(x => x.id === followId);
  $("hudBus").textContent = b.id;
  $("hudSpeed").textContent = Math.round(b.v * 3.6);
  $("hudDest").innerHTML = b.dest === "rupa" ? `To Rupatoli <span class="bn">· রূপাতলী</span>` : `To Campus <span class="bn">· ক্যাম্পাস</span>`;
  if (b.dwell > 0 && b.arrived) {
    $("hudNext").innerHTML = `<span>At <b>${b.arrived.name}</b></span><span class="eta">Leaves in ${Math.ceil(b.dwell)} s</span>`;
  } else {
    const { stop, dist } = nextStop(b);
    let between = 0;
    for (const st of STOP_ON_LOOP) { const d = loopDist(b.s, st.s); if (d > 0.5 && d < dist - 0.5 && st !== b.lastStop) between++; }
    $("hudNext").innerHTML = `<span>Next <b>${stop.name}</b></span><span class="eta">${fmtEta(dist / 8.5 + between * 14)}</span>`;
  }
}

/* ---------- main loop ---------- */
let last = performance.now(), time = 0, hudAcc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  const simDt = dt * mult, sub = Math.max(1, Math.ceil(simDt / 0.02)), h = simDt / sub;
  for (let i = 0; i < sub; i++) { stepBus(buses[0], h, buses[1]); stepBus(buses[1], h, buses[0]); }
  // Show buses larger when zoomed out so they stay visible; true size from zoom 18 in.
  const zk = clamp(Math.pow(2, 18 - map.getZoom()), 1, 6);
  for (const b of buses) { b.k = zk; placeBus(b, dt, time); }
  updateCamera(dt);
  hudAcc += dt; if (hudAcc > 0.2) { hudAcc = 0; updateHud(); }
  map.triggerRepaint();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__shuttle = { map, buses };   // for poking at it from the console
</script>
</body>
</html>
