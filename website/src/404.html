<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – BU Bus Tracker</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="{{SITE_URL}}assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="{{SITE_URL}}css/styles.css?v={{BUILD_ID}}">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('bubt-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .lost img { margin: 0 auto 28px; width: 120px; height: 120px; border-radius: 28px; box-shadow: var(--shadow); animation: float 6s ease-in-out infinite; }
    .lost h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; }
    .lost p { color: var(--muted); margin: 14px auto 28px; max-width: 30em; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="{{SITE_URL}}assets/icons/icon-192.png" alt="" width="120" height="120">
      <h1>This stop isn't on the route</h1>
      <p>The page you were looking for doesn't exist. Head back to the start to find the app, its schedule and the download.</p>
      <a class="btn btn-primary btn-lg" href="{{SITE_URL}}">Back to BU Bus Tracker</a>
    </div>
  </main>
</body>
</html>
