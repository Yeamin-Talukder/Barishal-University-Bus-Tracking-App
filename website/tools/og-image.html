<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #F3F0EA;
    background:
      radial-gradient(700px 420px at 92% 18%, rgba(95,212,188,.28), transparent 70%),
      radial-gradient(600px 400px at 0% 100%, rgba(59,167,208,.22), transparent 70%),
      linear-gradient(160deg, #18232B, #0B1115 70%);
    position: relative;
  }
  .grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px; }
  .copy { position: absolute; left: 76px; top: 86px; width: 620px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .brand b { font-size: 50px; letter-spacing: -1px; }
  h1 { font-size: 46px; line-height: 1.12; margin: 40px 0 16px; letter-spacing: -1px; font-weight: 800; }
  h1 span { color: #5FD4BC; }
  .bn { font-family: "Nirmala UI", "Hind Siliguri", sans-serif; font-size: 25px; color: #C9D2D8; margin: 0 0 30px; }
  .chips { display: flex; gap: 12px; }
  .chip { padding: 10px 18px; border-radius: 999px; font-size: 21px; font-weight: 600;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }
  .chip.live { color: #FFC53D; border-color: rgba(255,197,61,.4); }
  .phone { position: absolute; right: 86px; top: 46px; width: 290px; height: 628px;
    border-radius: 44px; background: #05080A; padding: 11px; box-sizing: border-box;
    transform: rotate(6deg); box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.08); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 34px; display: block; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="copy">
    <div class="brand"><img src="../../assets/icons/app_icon.png" alt=""><b>BU Bus Tracker</b></div>
    <h1>University of Barishal buses, <span>on the map.</span></h1>
    <p class="bn">বরিশাল বিশ্ববিদ্যালয়ের বাসের সময়সূচি ও অফলাইন ম্যাপ</p>
    <div class="chips"><span class="chip">Free</span><span class="chip">Works offline</span><span class="chip live">Live tracking soon</span></div>
  </div>
  <div class="phone"><img src="../src/assets/screens/map-dark.webp" alt=""></div>
</body>
</html>
